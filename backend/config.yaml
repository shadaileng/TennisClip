# TennisClip AI 运行配置
# 敏感信息（API Key 等）放入 .env（参考 .env.example）
# 依赖管理使用 uv：uv sync（见 pyproject.toml）

# LLM 模型配置（providers 模式，OpenAI 兼容协议格式）
# 每个 provider 统一三要素：base_url / api_key_env / model
# 后期可替换为数据库动态查询（接口不变：AppConfig.active_provider）
# api_key 不写在 yaml 里，通过 api_key_env 指定的环境变量从 .env 读取
llm:
  active_provider: default
  temperature: 0.2                    # 低温度保证结构化输出稳定
  max_tokens: 4096
  max_frames: 16                       # 每次 LLM 调用抽帧上限（降延迟；agnes 模型偏慢）
  timeout_seconds: 300                 # 单次调用超时（agnes-3.0-flash + 多帧较慢，需放大；报告阶段实测 121s）
  max_retries: 1                       # 超时/网络错误重试次数（避免 SDK 默认 2 次叠加放大超时）
  mock_mode: auto                     # auto | always | never
  providers:
    # 默认：阶跃星辰 Step 3.7 Flash（OpenAI 兼容端点）
    - name: default
      base_url: https://api.stepfun.com/v1
      api_key_env: STEPFLASH_API_KEY
      model: step3.7-flash
    # OpenAI 官方
    - name: openai
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-4o-mini
    # 本地 Ollama（OpenAI 兼容端点）
    - name: ollama
      base_url: http://127.0.0.1:11434/v1
      api_key_env: OLLAMA_API_KEY
      model: step3.7-flash
    # 本地 vLLM（OpenAI 兼容端点）
    - name: vllm
      base_url: http://127.0.0.1:8000/v1
      api_key_env: VLLM_API_KEY
      model: step3.7-flash

video:
  resolution: 720p               # 预处理统一输出分辨率
  fps: 30
  bitrate: 2M
  sample_rate: 30                # 送入模型的抽帧间隔（帧），降低 token 量
  max_input_seconds: 300         # 单条视频最大时长（秒）

highlight:
  target_duration: 15           # 集锦目标时长（秒）
  max_segments: 3               # 最多拼接的高光片段数
  min_segment_seconds: 3        # 单个片段最短时长（秒）
  scene_threshold: 0.4          # 场景切换判定阈值（ffmpeg scene filter）
  motion_fps: 4                 # 运动强度抽帧率（fps）
  motion_threshold: 0.05        # 运动活跃阈值（灰度帧差均值，0-255 尺度，兼作动作爆发下界）
  candidate_top_n: 5            # 候选窗口上限
  # 可插拔信号管线：audio | motion | scene | audio_motion | auto（默认音频击球为主+运动辅助）
  candidate_mode: audio_motion
  # 音频击球检测（主信号）
  audio_enabled: true
  audio_sample_rate: 16000
  audio_hit_percentile: 95      # 瞬态包络自适应阈值分位（0-100）
  hit_cluster_gap_seconds: 4.0  # 相邻击球聚为回合的间隔上限（秒）
  hit_window_expand: 2.0        # 回合窗口两侧外扩（秒）
  # 运动强度分位爆发（辅助/无声兜底）
  motion_action_percentile: 80  # 运动分数分位阈值（0-100）
  # 准备段后过滤（安全网）
  prep_exclusion: true
  min_segment_confidence: 0.6   # 低于此置信度的段丢弃
  # 分析分层 → 高光选择策略：level 驱动高光数量；all=所有高光回合（遍历整段、截取全部、不截断时长）
  level_strategies:
    beginner: { max_segments: 2 }
    intermediate: { max_segments: 3 }
    professional: { max_segments: 5 }
    all: { all_highlights: true }

report:
  levels: [beginner, intermediate, professional, all]   # 分析分层（all=所有高光回合）
  language: zh

queue:
  max_concurrent_tasks: 2
  task_timeout_seconds: 120

# 数据库配置（多兼容：默认 SQLite 单文件，可切 PostgreSQL / MySQL）
# 记录任务/输入/输出/结果快照/模型提供商配置/文件管理，支持审计与批量追溯
#
# 优先级（高→低）：进程环境变量 DATABASE_URL > .env > 本文件 url > 代码默认（SQLite）
# 敏感连接串请放 .env（gitignore）或容器/CI 注入，勿提交到本文件：
#   .env:  DATABASE_URL=postgresql+psycopg://user:pass@127.0.0.1:5432/tennisclip
database:
  # SQLite（默认，零配置，数据落 backend/data/tennisclip.db；被环境变量/.env 覆盖时此值仅作兜底）
  url: "sqlite:///./data/tennisclip.db"
  echo: false

# 目录布局：输入/输出均相对 data_dir（默认 data/sample_videos、data/outputs）
# 日志固定写入 data_dir/app.log，SQLite 落 data_dir/tennisclip.db
# data_dir 可被环境变量 TENNISCLIP_DATA_DIR 覆盖（优先级最高）
paths:
  sample_dir: sample_videos
  output_dir: outputs
  data_dir: data

logging:
  level: INFO

# 跨域配置（前后端分开部署、不同源时使用）
# allowed_origins: 允许访问本服务的来源列表；"*" 放行所有源（开发/内网演示用）。
# 生产环境建议收紧为具体源，例如：
#   cors:
#     allowed_origins: ["https://tennisclip.example.com"]
# 也可用环境变量 CORS_ALLOWED_ORIGINS（逗号分隔）覆盖，优先级更高。
cors:
  allowed_origins:
    - "*"
