[project]
name = "tennisclip"
version = "0.4.0"
description = "TennisClip AI — 网球视频高光集锦 + 动作技术分析工具（基于 Step 3.7 Flash）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "openai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.20.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "opencv-python>=4.9",
]
# CV 感知层（方案 12 · Step 2.10，按需安装）：uv sync --extra cv
# 权重文件放 backend/data/models/（gitignore 忽略），缺失时 detect.* 节点级联跳过
cv = [
    "torch>=2.2",
    "ultralytics>=8.2",
    "mediapipe>=0.10.14",
    "transformers>=4.40",
    "pillow>=10.0",
    "opencv-python>=4.9",
]
# 多数据库驱动（按需安装）：
# postgresql: "psycopg[binary]>=3.1"
# mysql:      "pymysql>=1.1"

[project.scripts]
tennisclip = "app.cli:main"

[tool.uv]
# uv 配置文件另见 uv.toml（cache-dir 等）

# 禁用 pytest 缓存插件：避免在工作区生成 pytest-cache-files-* 临时目录
# （.pytest_cache 写入受限时 pytest 8.x 会降级为每次新建临时目录，此处彻底关闭）
[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
